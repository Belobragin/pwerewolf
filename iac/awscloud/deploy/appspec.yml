version: 0.0
os: linux
files:
  - source: bin/werewolf
    destination: /opt/werewolf/bin
  - source: werewolf.service
    destination: /opt/werewolf
permissions:
  - object: /opt/werewolf/bin/werewolf
    mode: 755
    type:
      - file
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: root
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 60
      runas: root
