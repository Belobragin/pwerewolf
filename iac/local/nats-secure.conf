# nats-secure.conf - security configuration

port: 4222
http_port: 8222

# User authentication
authorization {
    users: [
        { user: $NATS_WEREWOLF_USER, password: $NATS_WEREWOLF_PSW},
        { user: $NATS_AKER_USER, password: $NATS_AKER_PSW}
    ]
}

jetstream {
    store_dir: /data/jetstream
    max_memory_store: 512MB
    max_file_store: 10GB
}